<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Aircraft wing over a sea of clouds at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="45%" stop-color="#0e1a30"/>
      <stop offset="78%" stop-color="#18294a"/>
      <stop offset="100%" stop-color="#223e6b"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#dfe9fb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#dfe9fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="navGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingTop" x1="0.15" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27427a"/>
      <stop offset="55%" stop-color="#1d3257"/>
      <stop offset="100%" stop-color="#141f38"/>
    </linearGradient>
    <radialGradient id="fan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d5e6fd"/>
      <stop offset="55%" stop-color="#5b83c4"/>
      <stop offset="100%" stop-color="#0f1b31"/>
    </radialGradient>
    <linearGradient id="cloudBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182b4d"/>
      <stop offset="100%" stop-color="#0b1322"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="150" ry="26"/>
      <ellipse cx="-95" cy="-9" rx="80" ry="20"/>
      <ellipse cx="95" cy="-11" rx="92" ry="22"/>
      <ellipse cx="0" cy="12" rx="185" ry="25"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1440" height="900" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#dbe7fb">
    <circle cx="90" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="210" cy="130" r="1.6" opacity="0.9"/>
    <circle cx="330" cy="45" r="1" opacity="0.5"/>
    <circle cx="420" cy="190" r="1.4" opacity="0.8"/>
    <circle cx="505" cy="80" r="1.1" opacity="0.6"/>
    <circle cx="600" cy="150" r="1.7" opacity="0.9"/>
    <circle cx="690" cy="55" r="1.2" opacity="0.7"/>
    <circle cx="770" cy="175" r="1" opacity="0.5"/>
    <circle cx="855" cy="95" r="1.5" opacity="0.85"/>
    <circle cx="930" cy="210" r="1.1" opacity="0.6"/>
    <circle cx="985" cy="60" r="1.3" opacity="0.75"/>
    <circle cx="1180" cy="90" r="1.4" opacity="0.8"/>
    <circle cx="1245" cy="230" r="1" opacity="0.55"/>
    <circle cx="1320" cy="60" r="1.6" opacity="0.9"/>
    <circle cx="1400" cy="150" r="1.1" opacity="0.65"/>
    <circle cx="1360" cy="300" r="1.3" opacity="0.7"/>
    <circle cx="120" cy="240" r="1" opacity="0.5"/>
    <circle cx="300" cy="300" r="1.5" opacity="0.8"/>
    <circle cx="540" cy="260" r="1.1" opacity="0.6"/>
    <circle cx="760" cy="300" r="1.3" opacity="0.75"/>
    <circle cx="1040" cy="330" r="1" opacity="0.5"/>
    <circle cx="150" cy="380" r="1.2" opacity="0.6"/>
    <circle cx="880" cy="380" r="1.4" opacity="0.7"/>
    <circle cx="450" cy="410" r="1" opacity="0.5"/>
  </g>

  <!-- Moon -->
  <circle cx="1120" cy="170" r="110" fill="url(#moonGlow)"/>
  <circle cx="1120" cy="170" r="44" fill="#dfe9fb" opacity="0.85"/>

  <!-- Contrail -->
  <line x1="60" y1="140" x2="1040" y2="430" stroke="#dbe7fb" stroke-width="16" stroke-linecap="round" opacity="0.08"/>
  <line x1="60" y1="140" x2="1040" y2="430" stroke="#dbe7fb" stroke-width="5" stroke-linecap="round" opacity="0.20"/>

  <!-- Horizon glow -->
  <rect x="0" y="380" width="1440" height="520" fill="url(#horizonGlow)"/>

  <!-- Sea of clouds -->
  <g>
    <use href="#cloud" x="140" y="470" fill="#16274a" opacity="0.85" transform="scale(1.1)"/>
    <use href="#cloud" x="480" y="445" fill="#1c315a" opacity="0.9" transform="scale(1.25)"/>
    <use href="#cloud" x="900" y="470" fill="#16274a" opacity="0.85" transform="scale(1.05)"/>
    <use href="#cloud" x="1260" y="440" fill="#1c315a" opacity="0.9" transform="scale(1.3)"/>
    <use href="#cloud" x="60" y="540" fill="#20375f" opacity="0.85" transform="scale(1.6)"/>
    <use href="#cloud" x="620" y="560" fill="#243e68" opacity="0.9" transform="scale(1.9)"/>
    <use href="#cloud" x="1120" y="560" fill="#20375f" opacity="0.85" transform="scale(1.7)"/>
    <use href="#cloud" x="240" y="650" fill="#29476f" opacity="0.9" transform="scale(2.2)"/>
    <use href="#cloud" x="880" y="680" fill="#2b4a75" opacity="0.9" transform="scale(2.4)"/>
    <use href="#cloud" x="1300" y="640" fill="#29476f" opacity="0.9" transform="scale(2)"/>
    <use href="#cloud" x="1080" y="300" fill="#3c5680" opacity="0.35" transform="scale(0.8)"/>
    <use href="#cloud" x="260" y="330" fill="#3c5680" opacity="0.30" transform="scale(0.7)"/>
  </g>

  <!-- Cloud base -->
  <rect x="0" y="760" width="1440" height="140" fill="url(#cloudBase)"/>

  <!-- Wing -->
  <g>
    <polygon points="1440,700 620,520 700,620 1440,900" fill="url(#wingTop)"/>
    <polygon points="1440,700 620,520 1440,560" fill="#33538a" opacity="0.35"/>
    <!-- leading edge highlight -->
    <line x1="1440" y1="700" x2="620" y2="520" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" opacity="0.15"/>
    <line x1="1440" y1="700" x2="620" y2="520" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <!-- panel lines -->
    <line x1="1440" y1="762" x2="665" y2="556" stroke="#2e4a7d" stroke-width="2" opacity="0.55"/>
    <line x1="1440" y1="832" x2="705" y2="590" stroke="#2e4a7d" stroke-width="2" opacity="0.45"/>
    <line x1="1440" y1="896" x2="730" y2="626" stroke="#2e4a7d" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- Engine -->
  <g>
    <polygon points="1005,668 1015,730 1125,730 1105,668" fill="#0e182b"/>
    <ellipse cx="1095" cy="762" rx="96" ry="46" fill="#0c1526"/>
    <ellipse cx="1095" cy="762" rx="96" ry="46" fill="none" stroke="#27427a" stroke-width="2" opacity="0.8"/>
    <circle cx="1072" cy="756" r="27" fill="url(#fan)"/>
    <g stroke="#0d1830" stroke-width="3.5" opacity="0.85">
      <line x1="1072" y1="729" x2="1072" y2="783"/>
      <line x1="1045" y1="756" x2="1099" y2="756"/>
      <line x1="1053" y1="737" x2="1091" y2="775"/>
      <line x1="1091" y1="737" x2="1053" y2="775"/>
    </g>
    <circle cx="1072" cy="756" r="5" fill="#0d1830"/>
    <ellipse cx="1200" cy="766" rx="22" ry="14" fill="#182a4c"/>
  </g>

  <!-- Wingtip light -->
  <circle cx="620" cy="520" r="34" fill="url(#navGlow)"/>
  <circle cx="620" cy="520" r="4" fill="#bae6fd"/>
  <circle cx="620" cy="520" r="2" fill="#ffffff"/>
</svg>
